{% extends "users/base.html" %}
{% block title %}انشاء حساب{% endblock title %}

{% block content %}
<div class="max-w-2xl mx-auto p-4">
  <form
    hx-post="/register/"
    hx-push-url="true"
    hx-target="this"
    hx-swap="outerHTML"
    class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-base-200 p-6 rounded-lg shadow"
  >
  {% csrf_token %}
  {% for field in form %}
    {% include "users/components/formfield.html" with field=field %}
  {% endfor %}
    <div class="md:col-span-2 text-right flex justify-end">
        <button type="submit" class="btn btn-primary">انشاء حساب</button>
    </div>
  </form>
</div>
{% endblock content %}
